# 一键启动 MongoDB 7 和 Redis 7：docker compose up -d
# 本机已经装了 MongoDB / Redis 的话可以不用 Docker，直接改 .env 里的地址即可
services:
  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  mongo_data:
